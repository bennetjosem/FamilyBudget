<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Family Expenses</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0a0a0f;
  --bg2:      #111118;
  --bg3:      #1a1a24;
  --border:   #2a2a3a;
  --text:     #eeeef5;
  --muted:    #6b6b8a;
  --accent:   #c8b4ff;
  --accent2:  #ff9eb5;
  --green:    #7effc4;
  --amber:    #ffd97d;
  --font:     'Syne', sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --r:        14px;
  --r-sm:     8px;
}

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  overflow-x: hidden;
}

/* ── Grain overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.5;
}

/* ── Glow blob ── */
.blob {
  position: fixed; width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(200,180,255,0.06) 0%, transparent 70%);
  border-radius: 50%; top: -150px; right: -150px;
  pointer-events: none; z-index: 0;
}

/* ── Layout ── */
.wrap {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto;
  padding: 0 1.25rem 6rem;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.5rem 0 1rem;
}
.logo {
  font-size: 1rem; font-weight: 800; letter-spacing: -0.02em;
  color: var(--text);
}
.logo span { color: var(--accent); }
.dash-link {
  font-size: 0.75rem; font-weight: 500; color: var(--muted);
  text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase;
  border: 1px solid var(--border); border-radius: 20px;
  padding: 0.35rem 0.9rem; transition: all 0.2s;
  display: flex; align-items: center; gap: 0.4rem;
}
.dash-link:hover { color: var(--accent); border-color: var(--accent); }
.dash-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── Monthly total ── */
.monthly-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
  position: relative; overflow: hidden;
}
.monthly-card::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.4;
}
.monthly-label {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem;
}
.monthly-amount {
  font-family: var(--mono); font-size: 2.4rem; font-weight: 500;
  color: var(--text); letter-spacing: -0.03em; line-height: 1;
}
.monthly-amount .currency { font-size: 1.2rem; color: var(--muted); margin-right: 2px; }
.monthly-sub {
  font-size: 0.72rem; color: var(--muted); margin-top: 0.5rem;
  display: flex; gap: 1rem;
}
.monthly-sub span { color: var(--text); }

/* ── Person selector ── */
.person-label {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 0.6rem; display: block;
}
.person-btns {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0.6rem; margin-bottom: 1rem;
}
.person-btn {
  padding: 0.9rem; border-radius: var(--r);
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--muted); font-family: var(--font);
  font-size: 1rem; font-weight: 700; cursor: pointer;
  transition: all 0.18s; text-align: center; letter-spacing: -0.01em;
}
.person-btn:hover { border-color: var(--accent); color: var(--text); }
.person-btn.active {
  background: linear-gradient(135deg, rgba(200,180,255,0.15), rgba(200,180,255,0.05));
  border-color: var(--accent); color: var(--accent);
  box-shadow: 0 0 20px rgba(200,180,255,0.1);
}

/* ── Form card ── */
.form-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 1.25rem;
  opacity: 0.4; pointer-events: none;
  transition: opacity 0.2s;
}
.form-card.ready { opacity: 1; pointer-events: all; }

.form-group { margin-bottom: 0.85rem; }
.form-label {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 0.4rem; display: block;
}
.form-input, .form-select {
  width: 100%; padding: 0.75rem 0.9rem;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text);
  font-family: var(--font); font-size: 0.95rem; outline: none;
  transition: border-color 0.2s; appearance: none; -webkit-appearance: none;
}
.form-input:focus, .form-select:focus { border-color: var(--accent); }
.amount-wrap { position: relative; }
.amount-wrap .rupee {
  position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-family: var(--mono); font-size: 1rem; pointer-events: none;
}
.amount-wrap .form-input { padding-left: 2rem; font-family: var(--mono); font-size: 1.2rem; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }

.submit-btn {
  width: 100%; padding: 0.9rem;
  background: var(--accent); color: #0a0a0f;
  border: none; border-radius: var(--r-sm);
  font-family: var(--font); font-size: 1rem; font-weight: 700;
  cursor: pointer; letter-spacing: -0.01em;
  transition: all 0.18s; margin-top: 0.25rem;
  position: relative; overflow: hidden;
}
.submit-btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
}
.submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(200,180,255,0.3); }
.submit-btn:active { transform: translateY(0); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── Recent row ── */
.recent-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 1.25rem 0 0.6rem;
}
.recent-title {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}
.recent-item {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.65rem 0; border-bottom: 1px solid var(--border);
  animation: fadeIn 0.3s ease;
}
.recent-item:last-child { border-bottom: none; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.recent-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0; opacity: 0.6;
}
.recent-info { flex: 1; min-width: 0; }
.recent-cat { font-size: 0.85rem; font-weight: 600; }
.recent-meta { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
.recent-amt {
  font-family: var(--mono); font-size: 0.88rem; font-weight: 500;
  color: var(--amber); flex-shrink: 0;
}

/* ── Toast ── */
#toast {
  position: fixed; bottom: 1.5rem; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 0.55rem 1.2rem;
  font-size: 0.82rem; opacity: 0; transition: all 0.25s;
  z-index: 100; pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok  { border-color: var(--green); color: var(--green); }
#toast.err { border-color: var(--accent2); color: var(--accent2); }

/* ── Spinner ── */
.spin {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(10,10,15,0.3);
  border-top-color: #0a0a0f;
  border-radius: 50%; animation: rot 0.6s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="blob"></div>
<div class="wrap">

  <!-- Header -->
  <header class="header">
    <div class="logo">family<span>.</span>expenses</div>
    <a href="dashboard.html" class="dash-link">
      Dashboard
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </header>

  <!-- Monthly total -->
  <div class="monthly-card">
    <div class="monthly-label">Spent this month</div>
    <div class="monthly-amount"><span class="currency">₹</span><span id="month-total">—</span></div>
    <div class="monthly-sub" id="month-sub">Loading…</div>
  </div>

  <!-- Person selector -->
  <span class="person-label">Who's adding?</span>
  <div class="person-btns">
    <button class="person-btn" id="btn-aleena" onclick="selectPerson('Aleena')">Aleena</button>
    <button class="person-btn" id="btn-bennet" onclick="selectPerson('Bennet')">Bennet</button>
  </div>

  <!-- Expense form -->
  <div class="form-card" id="form-card">
    <div class="form-group">
      <label class="form-label">Amount</label>
      <div class="amount-wrap">
        <span class="rupee">₹</span>
        <input class="form-input" type="number" inputmode="decimal" id="f-amount" placeholder="0"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-select" id="f-category"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input class="form-input" type="date" id="f-date"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Payment mode</label>
      <select class="form-select" id="f-mode"></select>
    </div>

    <div class="form-group">
      <label class="form-label">Note <span style="color:var(--muted);font-weight:400;font-size:0.65rem">(optional)</span></label>
      <input class="form-input" type="text" id="f-note" placeholder="Swiggy, petrol, medicine…"/>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitExpense()">Add expense</button>
  </div>

  <!-- Recent today -->
  <div class="recent-head">
    <span class="recent-title">Added today</span>
    <span style="font-size:0.72rem;color:var(--muted)" id="today-count"></span>
  </div>
  <div id="today-list"></div>

</div>
<div id="toast"></div>

<script>
// ── CONFIG — replace with your Supabase project values ───────
const SUPABASE_URL = "https://kjpnpbfhzclnnyyxwibu.supabase.co";
const SUPABASE_KEY = "sb_publishable_U0l1pJrSjq86RfuzEGGg8Q_SbSno0-k";

// ── State ────────────────────────────────────────────────────
let person   = sessionStorage.getItem("person") || "";
let config   = { categories:[], modes:[] };
let expenses = [];

// ── Helpers ──────────────────────────────────────────────────
const fmt     = n => Number(n).toLocaleString("en-IN", { maximumFractionDigits:0 });
const today   = () => new Date().toISOString().split("T")[0];
const ym      = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const ymLabel = m  => { const [y,mo]=m.split("-"); return new Date(y,mo-1).toLocaleString("en-IN",{month:"long",year:"numeric"}); };

function toast(msg, type="ok") {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = `show ${type}`;
  setTimeout(() => el.className = "", 2400);
}

// ── Supabase helpers ──────────────────────────────────────────
const sbH = () => ({
  "Content-Type" : "application/json",
  "apikey"       : SUPABASE_KEY,
  "Authorization": `Bearer ${SUPABASE_KEY}`,
  "Prefer"       : "return=representation"
});

async function sbGet(table, params="") {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: sbH() });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbPost(table, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method:"POST", headers: sbH(), body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function sbDelete(table, filter) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, {
    method:"DELETE", headers: sbH()
  });
  if (!r.ok) throw new Error(await r.text());
  return true;
}

// ── Data functions ────────────────────────────────────────────
async function fetchConfig() {
  const [cats, modes] = await Promise.all([
    sbGet("Categories", "select=Name,BudgetLimit&order=Name"),
    sbGet("PaymentModes", "select=Mode,IsCard&order=Mode")
  ]);
  return {
    categories: cats.map(r => ({ name:r.Name,  budget:r.BudgetLimit||0 })),
    modes:      modes.map(r => ({ name:r.Mode,  isCard:r.IsCard }))
  };
}

async function fetchMonthExpenses(monthYM) {
  const [y,m]  = monthYM.split("-").map(Number);
  const from   = `${monthYM}-01`;
  const to     = new Date(y, m, 0).toISOString().split("T")[0];
  const rows   = await sbGet("Expenses",
    `select=*&Date=gte.${from}&Date=lte.${to}&order=Date.desc`
  );
  return rows.map(mapExpense);
}

function mapExpense(r) {
  return {
    id           : r.ID,
    date         : r.Date,
    amount       : r.Amount,
    category     : r.Category,
    mode         : r.PaymentMode,
    note         : r.Note || "",
    addedBy      : r.AddedBy,
    ccCleared    : r.CCCleared === "YES",
    ccClearedDate: r.CCClearedDate || ""
  };
}

// ── Person select ─────────────────────────────────────────────
function selectPerson(name) {
  person = name;
  sessionStorage.setItem("person", name);
  document.getElementById("btn-aleena").classList.toggle("active", name==="Aleena");
  document.getElementById("btn-bennet").classList.toggle("active", name==="Bennet");
  document.getElementById("form-card").classList.add("ready");
}

if (person) selectPerson(person);

// ── Load config + data ────────────────────────────────────────
async function init() {
  try {
    const [cfg, exp] = await Promise.all([
      fetchConfig(),
      fetchMonthExpenses(ym())
    ]);
    config   = cfg;
    expenses = exp;
  } catch(e) {
    document.getElementById("month-sub").textContent = "Could not reach Supabase — check your URL and key";
    return;
  }

  // Populate dropdowns
  const catSel  = document.getElementById("f-category");
  const modeSel = document.getElementById("f-mode");
  catSel.innerHTML  = config.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
  modeSel.innerHTML = config.modes.map(m =>
    `<option value="${m.name}">${m.isCard ? "💳 " : ""}${m.name}</option>`
  ).join("");

  document.getElementById("f-date").value = today();
  renderMonthly();
  renderToday();
}

// ── Monthly summary ───────────────────────────────────────────
function renderMonthly() {
  const total  = expenses.reduce((s,e) => s + Number(e.amount), 0);
  const aleena = expenses.filter(e=>e.addedBy==="Aleena").reduce((s,e)=>s+Number(e.amount),0);
  const bennet = expenses.filter(e=>e.addedBy==="Bennet").reduce((s,e)=>s+Number(e.amount),0);

  document.getElementById("month-total").textContent = fmt(total);
  document.getElementById("month-sub").innerHTML =
    `<span style="color:var(--accent)">Aleena</span> <span>₹${fmt(aleena)}</span>
     &nbsp;·&nbsp;
     <span style="color:var(--accent2)">Bennet</span> <span>₹${fmt(bennet)}</span>
     &nbsp;·&nbsp; ${ymLabel(ym())}`;
}

// ── Today's entries ───────────────────────────────────────────
function renderToday() {
  const todayStr = today();
  const todayExp = expenses.filter(e => e.date === todayStr).slice().reverse();
  document.getElementById("today-count").textContent = todayExp.length ? `${todayExp.length} entries` : "";
  const el = document.getElementById("today-list");
  if (!todayExp.length) {
    el.innerHTML = `<div style="font-size:0.8rem;color:var(--muted);padding:0.5rem 0">No entries today yet.</div>`;
    return;
  }
  el.innerHTML = todayExp.map(e => `
    <div class="recent-item">
      <div class="recent-dot" style="background:${e.addedBy==="Aleena"?"var(--accent)":"var(--accent2)"}"></div>
      <div class="recent-info">
        <div class="recent-cat">${e.category}</div>
        <div class="recent-meta">${e.mode}${e.note?" · "+e.note:""} · ${e.addedBy}</div>
      </div>
      <div class="recent-amt">₹${fmt(e.amount)}</div>
    </div>`).join("");
}

// ── Submit ────────────────────────────────────────────────────
async function submitExpense() {
  if (!person) { toast("Tap your name first", "err"); return; }
  const amount   = parseFloat(document.getElementById("f-amount").value);
  const category = document.getElementById("f-category").value;
  const date     = document.getElementById("f-date").value;
  const mode     = document.getElementById("f-mode").value;
  const note     = document.getElementById("f-note").value.trim();

  if (!amount || amount <= 0) { toast("Enter a valid amount", "err"); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  try {
    await sbPost("Expenses", {
      Date: date, Amount: amount, Category: category,
      PaymentMode: mode, Note: note, AddedBy: person,
      CCCleared: "", CCClearedDate: null
    });
    toast("Added ✓");
    document.getElementById("f-amount").value = "";
    document.getElementById("f-note").value   = "";
    document.getElementById("f-date").value   = today();
    // Refresh
    expenses = await fetchMonthExpenses(ym());
    renderMonthly();
    renderToday();
  } catch(e) { toast("Error: " + e.message, "err"); }

  btn.disabled = false;
  btn.textContent = "Add expense";
}

// ── Enter key ─────────────────────────────────────────────────
document.getElementById("f-note").addEventListener("keydown", e => { if(e.key==="Enter") submitExpense(); });
document.getElementById("f-amount").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("f-note").focus(); });

init();
</script>
</body>
</html>
