<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>Family Expenses</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ── Dark theme (default) ── */
:root {
  --bg:#0a0a0f; --bg2:#111118; --bg3:#1a1a24; --border:#2a2a3a;
  --text:#eeeef5; --muted:#6b6b8a;
  --accent:#c8b4ff; --accent2:#ff9eb5; --green:#7effc4; --amber:#ffd97d; --red:#ff7e7e; --blue:#7eb8ff;
  --font:'Syne',sans-serif; --mono:'JetBrains Mono',monospace; --r:14px; --r-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
/* ── Light theme ── */
[data-theme="light"] {
  --bg:#f4f4f8; --bg2:#ffffff; --bg3:#eeeef5; --border:#d4d4e0;
  --text:#0a0a1a; --muted:#7070a0;
  --accent:#7c3aed; --accent2:#e11d7a; --green:#059669; --amber:#d97706; --red:#dc2626; --blue:#2563eb;
  --shadow:0 4px 24px rgba(0,0,0,0.08);
}

html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;overflow-x:hidden;transition:background 0.3s,color 0.3s;}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.4;}
[data-theme="light"] body::before{opacity:0.15;}

.blob{position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(200,180,255,0.06) 0%,transparent 70%);border-radius:50%;top:-150px;right:-150px;pointer-events:none;z-index:0;}
[data-theme="light"] .blob{background:radial-gradient(circle,rgba(124,58,237,0.04) 0%,transparent 70%);}

.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 1.25rem 6rem;}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0 1rem;}
.logo{font-size:1rem;font-weight:800;letter-spacing:-0.02em;}
.logo span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:0.6rem;}

/* ── Theme toggle ── */
.theme-btn{width:34px;height:34px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;
  transition:all 0.2s;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

.dash-link{font-size:0.75rem;font-weight:500;color:var(--muted);text-decoration:none;
  letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--border);
  border-radius:20px;padding:0.35rem 0.9rem;transition:all 0.2s;display:flex;align-items:center;gap:0.4rem;}
.dash-link:hover{color:var(--accent);border-color:var(--accent);}
.dash-link svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ── Monthly total ── */
.monthly-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:1.25rem 1.5rem;margin-bottom:1rem;position:relative;overflow:hidden;}
.monthly-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.4;}
.monthly-label{font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem;}
.monthly-amount{font-family:var(--mono);font-size:2.4rem;font-weight:500;letter-spacing:-0.03em;line-height:1;}
.monthly-amount .currency{font-size:1.2rem;color:var(--muted);margin-right:2px;}
.monthly-sub{font-size:0.72rem;color:var(--muted);margin-top:0.5rem;display:flex;gap:1rem;flex-wrap:wrap;}
.monthly-sub span{color:var(--text);}
.monthly-invest{font-size:0.72rem;color:var(--muted);margin-top:0.35rem;}
.monthly-invest span{color:var(--blue);}

/* ── Person selector ── */
.person-label{font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.6rem;display:block;}
.person-btns{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:1rem;}
.person-btn{padding:0.9rem;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border);
  color:var(--muted);font-family:var(--font);font-size:1rem;font-weight:700;cursor:pointer;
  transition:all 0.18s;text-align:center;}
.person-btn:hover{border-color:var(--accent);color:var(--text);}
.person-btn.active{background:linear-gradient(135deg,rgba(200,180,255,0.15),rgba(200,180,255,0.05));
  border-color:var(--accent);color:var(--accent);box-shadow:0 0 20px rgba(200,180,255,0.1);}
[data-theme="light"] .person-btn.active{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(124,58,237,0.03));}

/* ── Type toggle ── */
.type-toggle{display:flex;gap:0;margin-bottom:1rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:4px;gap:4px;}
.type-btn{flex:1;padding:0.55rem 0.5rem;border-radius:var(--r-sm);border:none;background:transparent;
  color:var(--muted);font-family:var(--font);font-size:0.82rem;font-weight:600;cursor:pointer;
  transition:all 0.2s;text-align:center;}
.type-btn.active-expense{background:var(--bg2);color:var(--accent);box-shadow:var(--shadow);}
.type-btn.active-refund{background:var(--bg2);color:var(--green);box-shadow:var(--shadow);}
.type-btn.active-investment{background:var(--bg2);color:var(--blue);box-shadow:var(--shadow);}

/* ── Form ── */
.form-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;opacity:0.4;pointer-events:none;transition:opacity 0.2s;}
.form-card.ready{opacity:1;pointer-events:all;}
.form-group{margin-bottom:0.85rem;}
.form-label{font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem;display:block;}
.form-input,.form-select{width:100%;padding:0.75rem 0.9rem;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);font-family:var(--font);font-size:0.95rem;outline:none;
  transition:border-color 0.2s;appearance:none;-webkit-appearance:none;}
.form-input:focus,.form-select:focus{border-color:var(--accent);}
.amount-wrap{position:relative;}
.amount-wrap .rupee{position:absolute;left:0.9rem;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--mono);font-size:1rem;pointer-events:none;}
.amount-wrap .form-input{padding-left:2rem;font-family:var(--mono);font-size:1.2rem;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;}

/* ── Submit ── */
.submit-btn{width:100%;padding:0.9rem;border:none;border-radius:var(--r-sm);
  font-family:var(--font);font-size:1rem;font-weight:700;cursor:pointer;
  transition:all 0.18s;margin-top:0.25rem;position:relative;overflow:hidden;}
.submit-btn.type-expense{background:var(--accent);color:#0a0a0f;}
.submit-btn.type-refund{background:var(--green);color:#0a0a0f;}
.submit-btn.type-investment{background:var(--blue);color:#0a0a0f;}
.submit-btn:hover{transform:translateY(-1px);filter:brightness(1.1);}
.submit-btn:active{transform:translateY(0);}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* ── Recent ── */
.recent-head{display:flex;align-items:center;justify-content:space-between;margin:1.25rem 0 0.6rem;}
.recent-title{font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.recent-item{display:flex;align-items:center;gap:0.75rem;padding:0.65rem 0;border-bottom:1px solid var(--border);animation:fadeIn 0.3s ease;}
.recent-item:last-child{border-bottom:none;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.recent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;opacity:0.7;}
.recent-info{flex:1;min-width:0;}
.recent-cat{font-size:0.85rem;font-weight:600;}
.recent-meta{font-size:0.7rem;color:var(--muted);margin-top:1px;}
.recent-amt{font-family:var(--mono);font-size:0.88rem;font-weight:500;flex-shrink:0;}

/* ── Toast ── */
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:0.55rem 1.2rem;
  font-size:0.82rem;opacity:0;transition:all 0.25s;z-index:100;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.ok{border-color:var(--green);color:var(--green);}
#toast.err{border-color:var(--accent2);color:var(--accent2);}

.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(10,10,15,0.3);
  border-top-color:#0a0a0f;border-radius:50%;animation:rot 0.6s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.tag-chip{display:inline-block;font-size:0.65rem;padding:1px 7px;border-radius:10px;
  background:rgba(200,180,255,0.12);color:var(--accent);margin:1px 2px;border:0.5px solid rgba(200,180,255,0.3);}
[data-theme="light"] .tag-chip{background:rgba(124,58,237,0.08);color:var(--accent);border-color:rgba(124,58,237,0.2);}
</style>
</head>
<body>
<div class="blob"></div>
<div class="wrap">

  <header class="header">
    <div class="logo">family<span>.</span>expenses</div>
    <div class="header-right">
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
      <a href="dashboard.html" class="dash-link">
        Dashboard
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </header>

  <!-- Monthly total -->
  <div class="monthly-card">
    <div class="monthly-label">This month</div>
    <div class="monthly-amount"><span class="currency">₹</span><span id="month-total">—</span></div>
    <div class="monthly-sub" id="month-sub">Loading…</div>
    <div class="monthly-invest" id="month-invest"></div>
  </div>

  <!-- Person selector -->
  <span class="person-label">Who's adding?</span>
  <div class="person-btns">
    <button class="person-btn" id="btn-aleena" onclick="selectPerson('Aleena')">Aleena</button>
    <button class="person-btn" id="btn-bennet" onclick="selectPerson('Bennet')">Bennet</button>
  </div>

  <!-- Type toggle -->
  <div class="type-toggle">
    <button class="type-btn active-expense" id="type-expense" onclick="selectType('expense')">💸 Expense</button>
    <button class="type-btn" id="type-refund" onclick="selectType('refund')">↩ Refund</button>
    <button class="type-btn" id="type-investment" onclick="selectType('investment')">📈 Invest</button>
  </div>

  <!-- Form -->
  <div class="form-card" id="form-card">

    <!-- Amount (always shown) -->
    <div class="form-group">
      <label class="form-label">Amount</label>
      <div class="amount-wrap">
        <span class="rupee">₹</span>
        <input class="form-input" type="number" inputmode="decimal" id="f-amount" placeholder="0"/>
      </div>
    </div>

    <!-- Expense fields -->
    <div id="expense-fields">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="f-category"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-input" type="date" id="f-date"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Payment mode</label>
        <select class="form-select" id="f-mode"></select>
      </div>
    </div>

    <!-- Investment fields -->
    <div id="investment-fields" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-select" id="f-inv-kind">
            <option>SIP</option>
            <option>Lump Sum</option>
            <option>FD</option>
            <option>RD</option>
            <option>Gold</option>
            <option>Stock</option>
            <option>PPF / NPS</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-input" type="date" id="f-inv-date"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Platform / Where</label>
        <input class="form-input" type="text" id="f-inv-platform" placeholder="Zerodha, Groww, HDFC FD…"/>
      </div>
      <div class="form-group">
        <label class="form-label">Goal <span style="color:var(--muted);font-weight:400;font-size:0.65rem">(optional)</span></label>
        <select class="form-select" id="f-inv-goal">
          <option value="">No goal</option>
        </select>
      </div>
    </div>

    <!-- Note (always shown) -->
    <div class="form-group">
      <label class="form-label">Note <span style="color:var(--muted);font-weight:400;font-size:0.65rem">(optional)</span></label>
      <input class="form-input" type="text" id="f-note" placeholder="Details…"/>
    </div>

    <div class="form-group">
      <label class="form-label">Tags <span style="color:var(--muted);font-weight:400;font-size:0.65rem">(optional · e.g. goa2026 wedding)</span></label>
      <input class="form-input" type="text" id="f-tags" placeholder="tag1 tag2 tag3"/>
    </div>
    <button class="submit-btn type-expense" id="submit-btn" onclick="submitEntry()">Add expense</button>
  </div>

  <!-- Today's entries -->
  <div class="recent-head">
    <span class="recent-title">Added today</span>
    <span style="font-size:0.72rem;color:var(--muted)" id="today-count"></span>
  </div>
  <div id="today-list"></div>

</div>
<div id="toast"></div>

<script>
const SUPABASE_URL = "https://kjpnpbfhzclnnyyxwibu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqcG5wYmZoemNsbm55eXh3aWJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTk5NzAsImV4cCI6MjA5NDkzNTk3MH0.V3OUjPYnf7jrTVE60lMuM2NY6TaBeh9YJ_-5FqlGAss";


let person    = sessionStorage.getItem("person") || "";
let entryType = "expense"; // "expense" | "refund" | "investment"
let config    = { categories:[], modes:[], goals:[] };
let expenses  = [];
let investments = [];

// ── Theme ─────────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute("data-theme") === "dark";
  const next = isDark ? "light" : "dark";
  html.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  document.getElementById("theme-btn").textContent = next === "dark" ? "🌙" : "☀️";
}
(function applyTheme() {
  const saved = localStorage.getItem("theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("theme-btn").textContent = saved === "dark" ? "🌙" : "☀️";
})();

// ── Type toggle ───────────────────────────────────────────────
function selectType(type) {
  entryType = type;
  ["expense","refund","investment"].forEach(t => {
    const btn = document.getElementById(`type-${t}`);
    btn.className = `type-btn${t === type ? ` active-${t}` : ""}`;
  });
  // show/hide fields
  document.getElementById("expense-fields").style.display    = type === "investment" ? "none" : "";
  document.getElementById("investment-fields").style.display = type === "investment" ? "" : "none";
  // update button style + label
  const btn = document.getElementById("submit-btn");
  btn.className = `submit-btn type-${type}`;
  btn.textContent = type === "expense" ? "Add expense" : type === "refund" ? "Add refund" : "Add investment";
}

// ── Person ────────────────────────────────────────────────────
function selectPerson(name) {
  person = name;
  sessionStorage.setItem("person", name);
  document.getElementById("btn-aleena").classList.toggle("active", name === "Aleena");
  document.getElementById("btn-bennet").classList.toggle("active", name === "Bennet");
  document.getElementById("form-card").classList.add("ready");
}
if (person) selectPerson(person);

// ── Helpers ───────────────────────────────────────────────────
const fmt     = n => Number(n).toLocaleString("en-IN", { maximumFractionDigits:0 });
const today   = () => new Date().toISOString().split("T")[0];
const ym      = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const ymLabel = m  => { const [y,mo]=m.split("-"); return new Date(y,mo-1).toLocaleString("en-IN",{month:"long",year:"numeric"}); };

function toast(msg, type="ok") {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = `show ${type}`;
  setTimeout(() => el.className = "", 2400);
}

// ── Supabase ──────────────────────────────────────────────────
const sbH = () => ({"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Prefer":"return=representation"});
async function sbGet(t, p="") { const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?${p}`,{headers:sbH()}); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function sbPost(t, b)   { const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}`,{method:"POST",headers:sbH(),body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); }

// ── Data ──────────────────────────────────────────────────────
async function fetchConfig() {
  const [cats, modes, goals] = await Promise.all([
    sbGet("Categories",   "select=Name,BudgetLimit&order=Name"),
    sbGet("PaymentModes", "select=Mode,IsCard&order=Mode"),
    sbGet("Goals",        "select=ID,Name,TargetAmount,TargetDate,Description&order=TargetDate")
  ]);
  return {
    categories: cats.map(r  => ({ name:r.Name,  budget:r.BudgetLimit||0 })),
    modes:      modes.map(r => ({ name:r.Mode,  isCard:r.IsCard })),
    goals:      goals.map(r => ({ id:r.ID, name:r.Name, target:r.TargetAmount, date:r.TargetDate, desc:r.Description||"" }))
  };
}

async function fetchMonthExpenses(monthYM) {
  const [y,m] = monthYM.split("-").map(Number);
  const from = `${monthYM}-01`, to = new Date(y,m,0).toISOString().split("T")[0];
  const rows = await sbGet("Expenses", `select=*&Date=gte.${from}&Date=lte.${to}&order=Date.desc`);
  return rows.map(r => ({
    id:r.ID, date:r.Date.slice(0,10), amount:r.Amount, category:r.Category,
    mode:r.PaymentMode, note:r.Note||"", addedBy:r.AddedBy, type:r.Type||"expense",
    tags:r.Tags||[]
  }));
}

async function fetchMonthInvestments(monthYM) {
  const [y,m] = monthYM.split("-").map(Number);
  const from = `${monthYM}-01`, to = new Date(y,m,0).toISOString().split("T")[0];
  const rows = await sbGet("Investments", `select=*&Date=gte.${from}&Date=lte.${to}&order=Date.desc`);
  return rows.map(r => ({
    id:r.ID, date:r.Date.slice(0,10), amount:r.Amount, kind:r.Kind,
    platform:r.Platform||"", note:r.Note||"", addedBy:r.AddedBy,
    tags:r.Tags||[]
  }));
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
  try {
    const [cfg, exp, inv] = await Promise.all([
      fetchConfig(),
      fetchMonthExpenses(ym()),
      fetchMonthInvestments(ym())
    ]);
    config = cfg; expenses = exp; investments = inv;
  } catch(e) {
    document.getElementById("month-sub").textContent = "Could not reach Supabase — check your URL and key";
    return;
  }

  const catSel = document.getElementById("f-category");
  catSel.innerHTML = config.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
  const modeSel = document.getElementById("f-mode");
  modeSel.innerHTML = config.modes.map(m => `<option value="${m.name}">${m.isCard?"💳 ":""}${m.name}</option>`).join("");

  document.getElementById("f-date").value     = today();
  document.getElementById("f-inv-date").value = today();

  populateGoalDropdown();
  renderMonthly();
  renderToday();
}

// ── Monthly summary ───────────────────────────────────────────
function renderMonthly() {
  const spent    = expenses.filter(e=>e.type==="expense").reduce((s,e)=>s+Number(e.amount),0);
  const refunds  = expenses.filter(e=>e.type==="refund").reduce((s,e)=>s+Number(e.amount),0);
  const net      = spent - refunds;
  const aleena   = expenses.filter(e=>e.addedBy==="Aleena"&&e.type==="expense").reduce((s,e)=>s+Number(e.amount),0);
  const bennet   = expenses.filter(e=>e.addedBy==="Bennet"&&e.type==="expense").reduce((s,e)=>s+Number(e.amount),0);
  const invested = investments.reduce((s,i)=>s+Number(i.amount),0);

  document.getElementById("month-total").textContent = fmt(net);
  document.getElementById("month-sub").innerHTML =
    `<span style="color:var(--accent)">Aleena</span><span>₹${fmt(aleena)}</span>
     &nbsp;·&nbsp;
     <span style="color:var(--accent2)">Bennet</span><span>₹${fmt(bennet)}</span>
     ${refunds>0?`&nbsp;·&nbsp;<span style="color:var(--green)">↩ ₹${fmt(refunds)} refund</span>`:""}
     &nbsp;·&nbsp;${ymLabel(ym())}`;

  document.getElementById("month-invest").innerHTML = invested > 0
    ? `📈 Invested <span>₹${fmt(invested)}</span> this month`
    : "";
}

// ── Today list ────────────────────────────────────────────────
function renderToday() {
  const todayStr = today();
  const todayExp = expenses.filter(e=>e.date===todayStr);
  const todayInv = investments.filter(i=>i.date===todayStr);
  const all = [
    ...todayExp.map(e=>({...e, _kind:"entry"})),
    ...todayInv.map(i=>({...i, _kind:"invest"}))
  ].reverse();

  document.getElementById("today-count").textContent = all.length ? `${all.length} entries` : "";
  const el = document.getElementById("today-list");
  if (!all.length) { el.innerHTML = `<div style="font-size:0.8rem;color:var(--muted);padding:0.5rem 0">No entries today yet.</div>`; return; }

  el.innerHTML = all.map(e => {
    const isInvest = e._kind === "invest";
    const isRefund = e.type  === "refund";
    const dotColor = isInvest ? "var(--blue)" : isRefund ? "var(--green)" : e.addedBy==="Aleena" ? "var(--accent)" : "var(--accent2)";
    const amtColor = isInvest ? "var(--blue)"  : isRefund ? "var(--green)" : "var(--amber)";
    const label    = isInvest ? `${e.kind} · ${e.platform||""}` : `${e.mode}${e.note?" · "+e.note:""}`;
    const cat      = isInvest ? "📈 " + e.kind : isRefund ? "↩ " + e.category : e.category;
    return `<div class="recent-item">
      <div class="recent-dot" style="background:${dotColor}"></div>
      <div class="recent-info">
        <div class="recent-cat">${cat}</div>
        <div class="recent-meta">${label} · ${e.addedBy}</div>
        ${(e.tags&&e.tags.length)?`<div style="margin-top:2px">${tagsHtml(e.tags)}</div>`:""}
      </div>
      <div class="recent-amt" style="color:${amtColor}">${isRefund?"-":""}₹${fmt(e.amount)}</div>
    </div>`;
  }).join("");
}

// ── Goal dropdown ────────────────────────────────────────────
function populateGoalDropdown() {
  const sel = document.getElementById("f-inv-goal");
  sel.innerHTML = '<option value="">No goal — general investment</option>';
  (config.goals||[]).forEach(g => {
    sel.innerHTML += `<option value="${g.id}">${g.name}${g.date?" · "+g.date.slice(0,7):""}`;
  });
}

// ── Tag helpers ──────────────────────────────────────────────
function parseTags(str) {
  return str.trim().split(/[\s,]+/).map(t=>t.replace(/^#/,"").toLowerCase()).filter(Boolean);
}
function tagsHtml(tags) {
  if(!tags||!tags.length) return "";
  return tags.map(t=>`<span class="tag-chip">#${t}</span>`).join("");
}

// ── Submit ────────────────────────────────────────────────────
async function submitEntry() {
  if (!person) { toast("Tap your name first","err"); return; }
  const amount = parseFloat(document.getElementById("f-amount").value);
  if (!amount || amount <= 0) { toast("Enter a valid amount","err"); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';

  try {
    if (entryType === "investment") {
      const kind     = document.getElementById("f-inv-kind").value;
      const platform = document.getElementById("f-inv-platform").value.trim();
      const date     = document.getElementById("f-inv-date").value;
      const note     = document.getElementById("f-note").value.trim();
      const goalId = document.getElementById("f-inv-goal").value || null;
      const tags = parseTags(document.getElementById("f-tags").value);
      await sbPost("Investments", { Date:date, Amount:amount, Kind:kind, Platform:platform, Note:note, AddedBy:person, GoalID:goalId, Tags:tags });
      toast("Investment added ✓");
      investments = await fetchMonthInvestments(ym());
    } else {
      const category = document.getElementById("f-category").value;
      const date     = document.getElementById("f-date").value;
      const mode     = document.getElementById("f-mode").value;
      const note     = document.getElementById("f-note").value.trim();
      const tags = parseTags(document.getElementById("f-tags").value);
      await sbPost("Expenses", { Date:date, Amount:amount, Category:category, PaymentMode:mode, Note:note, AddedBy:person, Type:entryType, CCCleared:"", CCClearedDate:null, Tags:tags });
      toast(entryType === "refund" ? "Refund added ✓" : "Expense added ✓");
      expenses = await fetchMonthExpenses(ym());
    }
    document.getElementById("f-amount").value = "";
    document.getElementById("f-note").value   = "";
    document.getElementById("f-tags").value   = "";
    renderMonthly(); renderToday();
  } catch(e) { toast("Error: "+e.message,"err"); }

  btn.disabled = false;
  btn.textContent = entryType==="expense"?"Add expense":entryType==="refund"?"Add refund":"Add investment";
}

document.getElementById("f-note").addEventListener("keydown",   e => { if(e.key==="Enter") submitEntry(); });
document.getElementById("f-amount").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("f-note").focus(); });

init();
</script>
</body>
